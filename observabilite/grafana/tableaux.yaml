# Fournisseur de tableaux de bord (module s3d03) : les fichiers JSON du dossier monté.
# Pas de dossier propre : le dossier « Studio 3D » est celui de la règle d'alerte (alertes.yaml).
apiVersion: 1
providers:
  - name: studio3d
    type: file
    disableDeletion: true
    allowUiUpdates: false       # le tableau se modifie dans le fichier versionné, pas à la souris
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/tableaux
